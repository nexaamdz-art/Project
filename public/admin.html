const rz=async(f,max=1100)=>{

};

document.addEventListener('change',e=>{const t=e.target;if(t.dataset.img&&t.files[0]){const f=t.files[0];up(f).then(u=>{if(t.dataset.img.startsWith('team.'))D._teamInit=true;set(D,t.dataset.img,u);save();draw();$('#st').textContent='✓ رُفعت الصورة — اضغط «🚀 نشر الآن»'}).catch(err=>{const msg='❌ '+(err?.message||'فشل إضافة الصورة');toast(msg);$('#st').textContent=msg}).finally(()=>{t.value=''})}if(t.dataset.gal&&t.files.length){const fs=[...t.files];Promise.all(fs.map(f=>up(f).then(u=>{D.gallery.push({img:u,c_en:'',c_ar:''})}))).then(()=>{save();draw();$('#st').textContent='✓ رُفعت الصور — اضغط «🚀 نشر الآن»'}).catch(err=>{const msg='❌ '+(err?.message||'فشل إضافة الصورة');toast(msg);$('#st').textContent=msg}).finally(()=>{t.value=''})}});
async function mail(id,s){toast('⏳ جارٍ إرسال البريد…');const{data,error}=await sb.functions.invoke('send-decision',{body:{id,status:s}});let m=error&&error.message;if(error&&error.context)try{const j=await error.context.json();m=j.detail||j.error}catch(e){}
 if(error||data?.error)toast('❌ تعذّر إرسال البريد: '+String(m||data.error).slice(0,140));else toast('✅ أُرسل البريد للطالب');load()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){tab=d.t;draw()}
 if(d.add){D.events.push({type:'workshop',date:new Date().toISOString().slice(0,10),time:'',place:'',t_ar:'',t_en:'',d_ar:'',d_en:'',img:''});save();draw()}
 if(d.addteam){D._teamInit=true;D.team.push({name_ar:'',name_en:'',role_ar:'',role_en:'',tier:'member',supervisor:false,photo:'assets/team/member-1.png',major:'',year:'',bio_ar:'',bio_en:'',links:{instagram:'',email:''}});save();draw()}
 if(d.seedteam){D._teamInit=true;D.team=structuredClone(window.ASTRA_DATA?.team||[]).map(x=>({...x,links:x.links||{}}));save();draw()}
 if(d.del&&d.del.startsWith('req.')){if(sb&&await ask('حذف هذا الطلب نهائياً؟')){const{error}=await sb.from('requests').delete().eq('id',d.del.slice(4));if(error)toast('❌ '+error.message);else load()}}
 else if(d.del&&await ask('هل تريد الحذف نهائياً؟')){const[a,i]=d.del.split('.');if(a=='team')D._teamInit=true;D[a].splice(+i,1);save();draw()}
 if(d.x){if(d.x.startsWith('team.'))D._teamInit=true;set(D,d.x,'');save();draw()}
 if(d.mv){const[i,k]=d.mv.split(',').map(Number),j=i+k;if(D.gallery[j]){[D.gallery[i],D.gallery[j]]=[D.gallery[j],D.gallery[i]];save();draw()}}
 if(d.mvteam){D._teamInit=true;const[i,k]=d.mvteam.split(',').map(Number),j=i+k;if(D.team[j]){[D.team[i],D.team[j]]=[D.team[j],D.team[i]];save();draw()}}
 if(d.f){flt=d.f;draw()}
 if(d.st&&sb){const[i,s]=d.st.split(',');const{error}=await sb.from('requests').update({status:s}).eq('id',i);if(error)return toast('❌ '+error.message);await load();const r=REQ.find(x=>x.id==i);if(s!='new'&&r){if(SB.emails){if(await ask(s=='accepted'?`إرسال بريد القبول إلى ${r.email} الآن؟`:`إرسال بريد اعتذار إلى ${r.email}؟`))mail(i,s)}else if(s=='accepted'){toast('✅ تم قبول الطلب — اضغط «✉ إرسال رسالة البريد» لمراسلة الطالب')}}}
 if(d.mail&&sb){const[i,s]=d.mail.split(',');mail(i,s)}
 if(b.id=='csv')csv();if(b.id=='nt'&&window.Notification)Notification.requestPermission()});
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['window.ASTRA_DATA='+JSON.stringify(D,null,1)+';'],{type:'text/javascript'}));a.download='data.js';a.click()};
$('#rs').onclick=async()=>{if(await ask('سيتم حذف مسودتك والعودة للنسخة المنشورة. متأكد؟')){try{localStorage.removeItem(K)}catch(e){}location.reload()}};
$('#pb').onclick=async()=>{if(!(sb&&ses))return;if(!await ask('نشر التغييرات للزوار الآن؟'))return;$('#st').textContent='⏳ جارٍ النشر…';D._teamInit=true;const now=new Date().toISOString();
 let r=await sb.from('site_content').update({data:D,updated_at:now}).eq('id',1).select('id');if(!r.error&&!(r.data&&r.data.length))r=await sb.from('site_content').insert({id:1,data:D});
 if(r.error){toast('❌ فشل النشر: '+r.error.message);$('#st').textContent=''}else{try{localStorage.removeItem(K)}catch(e){}toast('🚀 تم النشر — الموقع محدّث الآن');$('#st').textContent='✓ منشور'}};
const csvc=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function csv(){const rows=[['الاسم','البريد','التخصص','المجال','الرسالة','الحالة','التاريخ'],...REQ.map(r=>[r.name,r.email,r.dept,r.area,r.msg,ST[r.status]||r.status,r.created_at||''])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(csvc).join(',')).join('\n')],{type:'text/csv'}));a.download='requests.csv';a.click()}
async function load(){const{data,error}=await sb.from('requests').select('*').order('created_at',{ascending:false});if(error)RERR='تعذّر تحميل الطلبات: '+error.message;else{RERR='';REQ=data;NEW=REQ.filter(r=>r.status=='new').length;document.title=(NEW?`(${NEW}) `:'')+'لوحة تحكم AstraMind'}draw()}
async function loadContent(){const{data}=await sb.from('site_content').select('data').eq('id',1).maybeSingle();if(data&&data.data&&Object.keys(data.data).length&&!localStorage.getItem(K)){D=norm({...(window.ASTRA_DATA||{}),...data.data});draw()}}
function listen(){load();ch=sb.channel('rq').on('postgres_changes',{event:'*',schema:'public',table:'requests'},p=>{if(p.eventType=='INSERT'){const t='🔔 طلب انضمام جديد: '+p.new.name;toast(t);beep();if(window.Notification&&Notification.permission=='granted')new Notification('AstraMind',{body:t})}load()}).subscribe()}
if(SB){const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/+esm');sb=createClient(SB.url,SB.key);document.body.classList.add('lock');
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)$('#lerr').textContent='البريد أو كلمة السر غير صحيحة';if(window.Notification&&Notification.permission=='default')Notification.requestPermission()};
 $('#lo').onclick=()=>sb.auth.signOut();
 sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>{ses=!!s;document.body.classList.toggle('lock',!s);$('#lo').hidden=!s;$('#pb').hidden=!s;$('#ex').className=s?'s':'';if(s){if(!ch)listen();if(!cl){cl=true;loadContent()}}else{ch&&sb.removeChannel(ch);ch=null;cl=false;REQ=[];NEW=0}draw()},0))}
draw();
</script></body></html>
