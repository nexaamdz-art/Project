<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة تحكم AstraMind</title><link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Cairo,system-ui,sans-serif;background:#0b142a radial-gradient(circle at 80% -10%,#24358a66,transparent 50%) fixed;color:#e8eeff;padding-bottom:60px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:12px 18px;background:rgba(16,29,58,.9);backdrop-filter:blur(14px);border-bottom:1px solid #ffffff22;flex-wrap:wrap}h1{font-size:1.05rem;margin-inline-end:auto}#st{font-size:.75rem;color:#6ee7b7}
main{max-width:900px;margin:auto;padding:0 16px}.tabs{display:flex;gap:8px;padding:16px 0;overflow:auto}
button,.b,.lk{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:99px;padding:10px 18px;color:#fff;text-decoration:none;background:linear-gradient(145deg,#a58bf0,#7955C8 60%,#5a36a8);box-shadow:inset 2px 3px 6px #ffffff66,inset -3px -5px 10px #28106480,0 8px 18px #7955c855;transition:.25s;white-space:nowrap;font-size:.85rem}button:hover,.b:hover,.lk:hover{transform:translateY(-2px)}button:disabled{opacity:.5}
button.s,.tabs button:not(.on){background:#ffffff14;box-shadow:inset 0 0 0 1px #ffffff2a}button.r{background:linear-gradient(145deg,#ff8a9c,#c4152e)}.tabs button.on{background:linear-gradient(145deg,#58BDEB,#2b7fd0)}
.card{background:#ffffff0f;border:1px solid #ffffff22;border-radius:20px;padding:18px;margin-bottom:14px}.how{border-color:#58BDEB66;font-size:.85rem;line-height:1.9;color:#cfe3ff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{grid-column:1/-1}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:#9fb0d8}input,select,textarea{font:inherit;color:#fff;background:#0b142a;border:1px solid #ffffff2e;border-radius:12px;padding:10px 12px;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid #58BDEB}input[type=checkbox]{width:20px;height:20px}
.row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}.th{width:90px;height:90px;object-fit:cover;border-radius:12px}.big{width:100%;height:150px;margin-bottom:10px}
body.lock header,body.lock main{display:none}#lg{display:none;min-height:100vh;place-items:center;padding:20px}body.lock #lg{display:grid}#lf{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}#lf h2{font-size:1.3rem}#lerr{color:#ff8a9c;font-size:.85rem}
.bd{background:#ff4d6d;color:#fff;border-radius:99px;padding:0 8px;font-size:.75rem;margin-inline-start:4px}.tag{border-radius:99px;padding:2px 12px;font-size:.75rem;font-weight:800;background:#ffffff1f}.tag.new{background:#58BDEB;color:#06122e}.tag.accepted{background:#6ee7b7;color:#053}.tag.rejected{background:#ff8a9c;color:#400}
#ts{position:fixed;bottom:20px;inset-inline:20px;max-width:440px;margin:auto;background:linear-gradient(135deg,#7955C8,#58BDEB);padding:14px 18px;border-radius:18px;font-weight:800;box-shadow:0 14px 40px #0008;z-index:99;animation:up .5s}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(max-width:560px){.g{grid-template-columns:1fr}}
</style></head><body>
<div id="lg"><form id="lf" class="card"><h2>🔐 تسجيل دخول المشرف</h2><input id="le" type="email" placeholder="البريد" autocomplete="username" required><input id="lp" type="password" placeholder="كلمة السر" autocomplete="current-password" required><button>دخول</button><p id="lerr"></p></form></div>
<header><h1>🪐 لوحة تحكم AstraMind</h1><span id="st"></span><a class="lk" href="index.html?preview=1" target="_blank">👁 معاينة</a><button id="pb" hidden>🚀 نشر الآن</button><button id="ex">⬇ data.js</button><button class="s" id="rs">↺ تراجع للمنشور</button><button class="s" id="lo" hidden>خروج</button></header>
<main><div class="card how" id="how"></div><div class="tabs" id="tb"></div><div id="m"></div></main>
<script src="data.js"></script><script src="supabase-config.js"></script>
<script type="module">
const $=s=>document.querySelector(s),K='astra_draft',SB=window.ASTRA_SB,ST={new:'جديد',accepted:'مقبول',rejected:'مرفوض'};
let tab='e',sb=null,ses=false,ch=null,cl=false,REQ=[],NEW=0,flt='new',RERR='';
const norm=d=>{d.announce??={};d.events??=[];d.gallery??=[];d.contact??={};d.contact.social??={};return d};
let D=norm(JSON.parse(localStorage.getItem(K)||'null')||structuredClone(window.ASTRA_DATA||{}));
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o),set=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v},esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const save=()=>{localStorage.setItem(K,JSON.stringify(D));$('#st').textContent='✓ مسودة محفوظة'};
const F=(p,l,t='text',c='')=>`<label class="${c}">${l}${t=='area'?`<textarea rows="2" data-p="${p}">${esc(get(D,p))}</textarea>`:`<input type="${t}" data-p="${p}" value="${esc(get(D,p))}">`}</label>`;
const TYPES=[['workshop','ورشة'],['conference','مؤتمر'],['contest','مسابقة'],['meet','لقاء'],['news','خبر']];
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}};
const toast=t=>{const d=document.createElement('div');d.id='ts';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),6000)};
const V={
a:()=>`<div class="card"><label style="flex-direction:row;align-items:center;gap:10px;font-size:1rem;color:#fff"><input type="checkbox" data-p="announce.on" ${D.announce.on?'checked':''}> إظهار شريط «إعلان مهم» في أعلى الموقع</label><div class="g" style="margin-top:12px">${F('announce.t_ar','نص الإعلان (عربي)','text','f')}${F('announce.t_en','Announcement (English)','text','f')}${F('announce.link','رابط عند الضغط (اختياري) مثل #join أو https://…','text','f')}</div></div>`,
e:()=>D.events.map((e,i)=>`<div class="card"><div class="g"><label>النوع<select data-p="events.${i}.type">${TYPES.map(([k,v])=>`<option value="${k}" ${e.type==k?'selected':''}>${v}</option>`).join('')}</select></label>${F(`events.${i}.date`,'التاريخ','date')}${F(`events.${i}.t_ar`,'العنوان (عربي)')}${F(`events.${i}.t_en`,'Title (English)')}${F(`events.${i}.time`,'الساعة (اختياري) مثل 10:00')}${F(`events.${i}.place`,'المكان')}${F(`events.${i}.d_ar`,'وصف قصير (عربي)','area')}${F(`events.${i}.d_en`,'Short description (English)','area')}</div><div class="row">${e.img?`<img class="th" src="${esc(e.img)}">`:''}<label class="b" style="color:#fff;flex-direction:row">📷 ${e.img?'تغيير الصورة':'إضافة صورة'}<input type="file" accept="image/*" hidden data-img="events.${i}.img"></label>${e.img?`<button class="s" data-x="events.${i}.img">إزالة الصورة</button>`:''}<button class="r" data-del="events.${i}" style="margin-inline-start:auto">🗑 حذف</button></div></div>`).join('')+'<button data-add="1">＋ إضافة ورشة / فعالية</button>',
g:()=>`<div class="g3">${D.gallery.map((x,i)=>`<div class="card"><img class="th big" src="${esc(x.img)}">${F(`gallery.${i}.c_ar`,'التعليق (عربي)')}${F(`gallery.${i}.c_en`,'Caption (English)')}<div class="row"><button class="s" data-mv="${i},-1">▲</button><button class="s" data-mv="${i},1">▼</button><button class="r" data-del="gallery.${i}" style="margin-inline-start:auto">🗑</button></div></div>`).join('')}</div><label class="b" style="color:#fff;flex-direction:row;display:inline-flex">＋ إضافة صور<input type="file" accept="image/*" multiple hidden data-gal></label>`,
r:()=>REQV(),
c:()=>`<div class="card"><div class="g">${F('contact.email','بريد النادي','email','f')}${['instagram','facebook','linkedin','youtube'].map(k=>F('contact.social.'+k,k[0].toUpperCase()+k.slice(1)+' (رابط)','url')).join('')}</div></div>`};
function REQV(){if(!SB)return '<div class="card how">لم يُربط الموقع بقاعدة البيانات بعد. اتبع <b>SETUP-SUPABASE.txt</b> ثم ضع إعداداتك في <b>supabase-config.js</b>.</div>';
 if(RERR)return `<div class="card how">${esc(RERR)}</div>`;const L=REQ.filter(r=>flt=='all'||r.status==flt),em=SB.emails;
 const stat=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">${[['الكل',REQ.length],['جديدة',NEW],['مقبولة',REQ.filter(r=>r.status=='accepted').length]].map(([l,n])=>`<div class="card" style="text-align:center;margin:0"><b style="font-size:1.6rem">${n}</b><br><small>${l}</small></div>`).join('')}</div>`;
 return stat+`<div class="row" style="margin:0 0 14px">${[['new','🆕 جديدة'],['accepted','✅ مقبولة'],['rejected','❌ مرفوضة'],['all','الكل']].map(([k,v])=>`<button data-f="${k}" class="${flt==k?'':'s'}">${v}</button>`).join('')}<button class="s" id="nt" style="margin-inline-start:auto">🔔 إشعارات المتصفح</button><button class="s" id="csv">⬇ CSV</button></div>`+(L.map(r=>`<div class="card"><div class="row" style="margin:0 0 8px"><b>${esc(r.name)}</b><span class="tag ${esc(r.status)}">${ST[r.status]||esc(r.status)}</span>${r.notified_at?'<span class="tag">✉ أُرسل البريد</span>':''}<small style="margin-inline-start:auto;color:#9fb0d8">${esc(r.created_at?new Date(r.created_at).toLocaleString('ar-DZ'):'')}</small></div><div style="font-size:.88rem;line-height:1.9;color:#cfe3ff">📧 <a style="color:#58BDEB" href="mailto:${esc(r.email)}">${esc(r.email)}</a><br>🎓 ${esc(r.dept)||'—'} · 💡 ${esc(r.area)}<br>${esc(r.msg)}</div><div class="row"><button data-st="${esc(r.id)},accepted">✓ قبول</button><button class="s" data-st="${esc(r.id)},rejected">✗ رفض</button><button class="s" data-st="${esc(r.id)},new">↩ جديد</button>${em&&r.status!='new'?`<button class="s" data-mail="${esc(r.id)},${esc(r.status)}">✉ ${r.notified_at?'إعادة إرسال':'إرسال'} البريد</button>`:''}<button class="r" data-del="req.${esc(r.id)}" style="margin-inline-start:auto">🗑</button></div></div>`).join('')||'<div class="card">لا توجد طلبات هنا.<br><small>إن كنت واثقاً أن طلبات وصلت ولا تظهر، فتأكد أن بريدك مكتوب بدقة في is_admin() داخل schema.sql.</small></div>')}
const TB=()=>[['e','📅 الورشات والفعاليات'],['r',`📥 طلبات الانضمام${NEW?` <b class="bd">${NEW}</b>`:''}`],['a','📢 إعلان مهم'],['g','🖼 المعرض'],['c','✉️ التواصل']].map(([k,v])=>`<button data-t="${k}" class="${tab==k?'on':''}">${v}</button>`).join('');
function draw(){$('#tb').innerHTML=TB();$('#m').innerHTML=V[tab]();$('#how').innerHTML=sb&&ses?'📌 عدّل ما تشاء ثم اضغط <b>🚀 نشر الآن</b>: يتحدث الموقع للزوار فوراً دون رفع أي ملف. تُحفظ مسودتك تلقائياً، و«معاينة» تريك النتيجة قبل النشر. الصور تُرفع إلى Supabase تلقائياً.':'📌 <b>وضع بدون قاعدة بيانات:</b> عدّل، اضغط «معاينة»، ثم «⬇ data.js» وارفع الملف إلى مجلد <b>public</b> في GitHub مستبدلاً القديم.'}
const rz=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c)};i.src=r.result};r.readAsDataURL(f)});
async function up(f){const c=await rz(f);if(!(sb&&ses))return c.toDataURL('image/jpeg',.82);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),p=`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}.jpg`;$('#st').textContent='⏳ جارٍ رفع الصورة…';
 const{error}=await sb.storage.from('media').upload(p,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error){toast('❌ فشل رفع الصورة: '+error.message);throw error}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(p){set(D,p,t.type=='checkbox'?t.checked:t.value);save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.img&&t.files[0])up(t.files[0]).then(u=>{set(D,t.dataset.img,u);save();draw()}).catch(()=>{});if(t.dataset.gal)[...t.files].forEach(f=>up(f).then(u=>{D.gallery.push({img:u,c_en:'',c_ar:''});save();draw()}).catch(()=>{}))});
async function mail(id,s){toast('⏳ جارٍ إرسال البريد…');const{data,error}=await sb.functions.invoke('send-decision',{body:{id,status:s}});let m=error&&error.message;if(error&&error.context)try{const j=await error.context.json();m=j.detail||j.error}catch(e){}
 if(error||data?.error)toast('❌ تعذّر إرسال البريد: '+String(m||data.error).slice(0,140));else toast('✅ أُرسل البريد للطالب');load()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){tab=d.t;draw()}
 if(d.add){D.events.push({type:'workshop',date:'',time:'',place:'',t_ar:'',t_en:'',d_ar:'',d_en:'',img:''});save();draw()}
 if(d.del&&d.del.startsWith('req.')){if(sb&&confirm('حذف هذا الطلب نهائياً؟'))sb.from('requests').delete().eq('id',d.del.slice(4)).then(load)}
 else if(d.del&&confirm('هل تريد الحذف نهائياً؟')){const[a,i]=d.del.split('.');D[a].splice(+i,1);save();draw()}
 if(d.x){set(D,d.x,'');save();draw()}
 if(d.mv){const[i,k]=d.mv.split(',').map(Number),j=i+k;if(D.gallery[j]){[D.gallery[i],D.gallery[j]]=[D.gallery[j],D.gallery[i]];save();draw()}}
 if(d.f){flt=d.f;draw()}
 if(d.st&&sb){const[i,s]=d.st.split(',');sb.from('requests').update({status:s}).eq('id',i).then(async({error})=>{if(error)return toast('❌ '+error.message);await load();const r=REQ.find(x=>x.id==i);if(SB.emails&&s!='new'&&r&&confirm(s=='accepted'?`إرسال بريد القبول إلى ${r.email} الآن؟`:`إرسال بريد اعتذار إلى ${r.email}؟`))mail(i,s)})}
 if(d.mail&&sb){const[i,s]=d.mail.split(',');mail(i,s)}
 if(b.id=='csv')csv();if(b.id=='nt'&&window.Notification)Notification.requestPermission()});
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['window.ASTRA_DATA='+JSON.stringify(D,null,1)+';'],{type:'text/javascript'}));a.download='data.js';a.click()};
$('#rs').onclick=()=>{if(confirm('سيتم حذف مسودتك والعودة للنسخة المنشورة. متأكد؟')){localStorage.removeItem(K);location.reload()}};
$('#pb').onclick=async()=>{if(!(sb&&ses))return;if(!confirm('نشر التغييرات للزوار الآن؟'))return;$('#st').textContent='⏳ جارٍ النشر…';const now=new Date().toISOString();
 let r=await sb.from('site_content').update({data:D,updated_at:now}).eq('id',1).select('id');if(!r.error&&!(r.data&&r.data.length))r=await sb.from('site_content').insert({id:1,data:D});
 if(r.error){toast('❌ فشل النشر: '+r.error.message);$('#st').textContent=''}else{localStorage.removeItem(K);toast('🚀 تم النشر — الموقع محدّث الآن');$('#st').textContent='✓ منشور'}};
const csvc=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function csv(){const rows=[['الاسم','البريد','التخصص','المجال','الرسالة','الحالة','التاريخ'],...REQ.map(r=>[r.name,r.email,r.dept,r.area,r.msg,ST[r.status]||r.status,r.created_at||''])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(csvc).join(',')).join('\n')],{type:'text/csv'}));a.download='requests.csv';a.click()}
async function load(){const{data,error}=await sb.from('requests').select('*').order('created_at',{ascending:false});if(error)RERR='تعذّر تحميل الطلبات: '+error.message;else{RERR='';REQ=data;NEW=REQ.filter(r=>r.status=='new').length;document.title=(NEW?`(${NEW}) `:'')+'لوحة تحكم AstraMind'}draw()}
async function loadContent(){const{data}=await sb.from('site_content').select('data').eq('id',1).maybeSingle();if(data&&data.data&&data.data.events&&!localStorage.getItem(K)){D=norm(data.data);draw()}}
function listen(){load();ch=sb.channel('rq').on('postgres_changes',{event:'*',schema:'public',table:'requests'},p=>{if(p.eventType=='INSERT'){const t='🔔 طلب انضمام جديد: '+p.new.name;toast(t);beep();if(window.Notification&&Notification.permission=='granted')new Notification('AstraMind',{body:t})}load()}).subscribe()}
if(SB){const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/+esm');sb=createClient(SB.url,SB.key);document.body.classList.add('lock');
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)$('#lerr').textContent='البريد أو كلمة السر غير صحيحة';if(window.Notification&&Notification.permission=='default')Notification.requestPermission()};
 $('#lo').onclick=()=>sb.auth.signOut();
 sb.auth.onAuthStateChange((ev,s)=>setTimeout(()=>{ses=!!s;document.body.classList.toggle('lock',!s);$('#lo').hidden=!s;$('#pb').hidden=!s;$('#ex').className=s?'s':'';if(s){if(!ch)listen();if(!cl){cl=true;loadContent()}}else{ch&&sb.removeChannel(ch);ch=null;cl=false;REQ=[];NEW=0}draw()},0))}
draw();
</script></body></html>
